<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer shield border (dark blue) -->
  <path d="M 100 20 L 170 60 L 170 120 Q 170 180 100 220 Q 30 180 30 120 L 30 60 Z"
        fill="none" stroke="#0052CC" stroke-width="6" filter="url(#shadow)"/>

  <!-- Inner shield (bright blue) -->
  <path d="M 100 28 L 162 62 L 162 120 Q 162 172 100 210 Q 38 172 38 120 L 38 62 Z"
        fill="#0052E8"/>

  <!-- Gradient background for depth -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0061FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0041BB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <path d="M 100 28 L 162 62 L 162 120 Q 162 172 100 210 Q 38 172 38 120 L 38 62 Z"
        fill="url(#bgGradient)"/>

  <!-- Letter "U" in turquoise/mint green -->
  <defs>
    <linearGradient id="uGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4EDDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3EC9B5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- U shape - left vertical -->
  <rect x="60" y="70" width="18" height="65" rx="4" fill="url(#uGradient)"/>

  <!-- U shape - right vertical -->
  <rect x="122" y="70" width="18" height="65" rx="4" fill="url(#uGradient)"/>

  <!-- U shape - bottom curve -->
  <ellipse cx="100" cy="155" rx="42" ry="28" fill="url(#uGradient)"/>

  <!-- Highlight on U for dimension -->
  <ellipse cx="100" cy="80" rx="35" ry="12" fill="rgba(255,255,255,0.15)"/>

  <!-- Optional: small accent line -->
  <line x1="70" y1="65" x2="130" y2="65" stroke="#4EDDC4" stroke-width="2" opacity="0.3"/>
</svg>
